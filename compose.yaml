services:
  ssh:
    build: .
    environment:
      PANOPTICON_ENVIRONMENT: dev
      PANOPTICON_SSH__HOST: "0.0.0.0"
      PANOPTICON_SSH__PORT: "2222"
      PANOPTICON_SSH__HOST_KEY_PATH: '["/app/keys/ssh_host_key"]'
      PANOPTICON_LOGGING__LOG_DIR: "/app/logs"
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      - ssh_keys:/app/keys
      - ssh_logs:/app/logs
  redis:
    image: redis:8
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  ssh_keys:
  ssh_logs:
  redis_data: